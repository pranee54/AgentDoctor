name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to draft a release for (e.g. v0.1.0-beta)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  draft-release:
    name: Draft GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gates
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
          npm run build

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve release notes
        id: notes
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          # Strip leading v for filename match: v0.1.0-beta -> 0.1.0-beta
          VER="${TAG#v}"
          CANDIDATE="docs/release-notes-v${VER}.md"
          if [ -f "$CANDIDATE" ]; then
            echo "path=$CANDIDATE" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack npm tarball
        run: |
          npm pack
          ls -la agentdoctor-*.tgz

      - name: Create draft release (with notes file)
        if: steps.notes.outputs.path != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: AgentDoctor ${{ steps.tag.outputs.name }}
          draft: true
          generate_release_notes: true
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            LICENSE
            README.md
            agentdoctor-*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create draft release (generated notes only)
        if: steps.notes.outputs.path == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: AgentDoctor ${{ steps.tag.outputs.name }}
          draft: true
          generate_release_notes: true
          files: |
            LICENSE
            README.md
            agentdoctor-*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
