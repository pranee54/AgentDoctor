name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Keep PR supersession; never cancel in-flight main runs (reruns/outages were wiping them).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: |
          mkdir -p test-results
          npm test -- --reporter=default --reporter=json --outputFile=test-results/results.json

      - name: Pack dry-run
        run: npm pack --dry-run

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: test-results/
          if-no-files-found: ignore

      - name: Upload build artifact
        if: success() && matrix.node-version == '20'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  action-smoke:
    name: GitHub Action smoke · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: normal output
            case: normal
            output-file: test-results/action-report.json
            expected: success
            path: fixtures/clean-configured-project
            version: 0.3.0-beta
            minimum-score: ""
            fail-on-severity: ""
            expected-outcome: success
            summary: "false"
            annotations: "false"
          - name: nested output
            case: nested
            output-file: test-results/nested/action-report.json
            expected: success
            path: fixtures/clean-configured-project
            version: 0.3.0-beta
            minimum-score: ""
            fail-on-severity: ""
            expected-outcome: success
            summary: "false"
            annotations: "false"
          - name: traversal rejected
            case: traversal
            output-file: ../report.json
            expected: failure
            path: fixtures/clean-configured-project
            version: 0.3.0-beta
            minimum-score: ""
            fail-on-severity: ""
            expected-outcome: ""
            summary: "false"
            annotations: "false"
          - name: escaping parent symlink rejected
            case: parent-symlink
            output-file: test-results/escape-parent/report.json
            expected: failure
            path: fixtures/clean-configured-project
            version: 0.3.0-beta
            minimum-score: ""
            fail-on-severity: ""
            expected-outcome: ""
            summary: "false"
            annotations: "false"
          - name: output symlink rejected
            case: output-symlink
            output-file: test-results/output-symlink.json
            expected: failure
            path: fixtures/clean-configured-project
            version: 0.3.0-beta
            minimum-score: ""
            fail-on-severity: ""
            expected-outcome: ""
            summary: "false"
            annotations: "false"
          - name: directory rejected
            case: directory
            output-file: test-results/output-directory
            expected: failure
            path: fixtures/clean-configured-project
            version: 0.3.0-beta
            minimum-score: ""
            fail-on-severity: ""
            expected-outcome: ""
            summary: "false"
            annotations: "false"
          - name: policy min-score fails
            case: policy-min-score
            output-file: test-results/policy-min-score.json
            expected: failure
            path: fixtures/insecure-agent-project
            version: workspace
            minimum-score: "90"
            fail-on-severity: ""
            expected-outcome: policy-failure
            summary: "true"
            annotations: "true"
          - name: policy severity fails
            case: policy-severity
            output-file: test-results/policy-severity.json
            expected: failure
            path: fixtures/insecure-agent-project
            version: workspace
            minimum-score: ""
            fail-on-severity: critical
            expected-outcome: policy-failure
            summary: "true"
            annotations: "true"
          - name: policy clean passes
            case: policy-clean
            output-file: test-results/policy-clean.json
            expected: success
            path: fixtures/clean-configured-project
            version: workspace
            minimum-score: "90"
            fail-on-severity: critical
            expected-outcome: success
            summary: "true"
            annotations: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        if: matrix.version == 'workspace'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install runtime dependencies for workspace CLI
        if: matrix.version == 'workspace'
        run: npm ci --omit=dev

      - name: Prepare output-path case
        env:
          CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          mkdir -p test-results
          case "$CASE" in
            parent-symlink)
              ln -s "$RUNNER_TEMP" test-results/escape-parent
              ;;
            output-symlink)
              ln -s "$RUNNER_TEMP/outside-report.json" test-results/output-symlink.json
              ;;
            directory)
              mkdir -p test-results/output-directory
              ;;
          esac

      - name: Run AgentDoctor action
        id: agentdoctor
        continue-on-error: ${{ matrix.expected == 'failure' }}
        uses: ./
        with:
          path: ${{ matrix.path }}
          output-file: ${{ matrix.output-file }}
          version: ${{ matrix.version }}
          minimum-score: ${{ matrix.minimum-score }}
          fail-on-severity: ${{ matrix.fail-on-severity }}
          summary: ${{ matrix.summary }}
          annotations: ${{ matrix.annotations }}

      - name: Validate expected step outcome
        env:
          ACTUAL_OUTCOME: ${{ steps.agentdoctor.outcome }}
          EXPECTED_OUTCOME: ${{ matrix.expected }}
        run: |
          if [ "$ACTUAL_OUTCOME" != "$EXPECTED_OUTCOME" ]; then
            echo "expected $EXPECTED_OUTCOME, got $ACTUAL_OUTCOME" >&2
            exit 1
          fi

      - name: Validate action outcome output
        if: matrix.expected-outcome != ''
        env:
          ACTUAL: ${{ steps.agentdoctor.outputs.outcome }}
          EXPECTED: ${{ matrix.expected-outcome }}
        run: |
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "expected outcome=$EXPECTED, got $ACTUAL" >&2
            exit 1
          fi

      - name: Validate containment
        if: matrix.expected == 'failure' && matrix.version != 'workspace'
        env:
          CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          case "$CASE" in
            parent-symlink)
              test ! -e "$RUNNER_TEMP/report.json"
              ;;
            output-symlink)
              test ! -e "$RUNNER_TEMP/outside-report.json"
              ;;
          esac

      - name: Validate JSON report
        if: matrix.expected == 'success' || startsWith(matrix.case, 'policy-')
        env:
          REPORT_PATH: ${{ steps.agentdoctor.outputs.report-path }}
          VERSION_MODE: ${{ matrix.version }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, "utf8"));
          if (process.env.VERSION_MODE !== "workspace" && report.version !== "0.3.0-beta") {
            throw new Error(`unexpected AgentDoctor version: ${report.version}`);
          }
          if (
            !Array.isArray(report.findings) ||
            report.scoringAvailable !== true ||
            report.scores == null ||
            typeof report.scores.overall !== "number"
          ) {
            throw new Error("action report does not match the current JSON contract");
          }
          NODE

      - name: Upload AgentDoctor report
        if: matrix.expected == 'success' || startsWith(matrix.case, 'policy-')
        uses: actions/upload-artifact@v4
        with:
          name: agentdoctor-report-${{ matrix.case }}
          path: ${{ matrix.output-file }}
          if-no-files-found: error
