<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">Repository architecture</title>
  <desc id="desc">Important AgentDoctor source directories</desc>
  <rect width="1000" height="720" fill="#07111F"/>
  <rect x="28" y="28" width="944" height="664" rx="14" fill="none" stroke="#1E293B"/>
  <text x="52" y="72" font-family="system-ui,sans-serif" font-size="24" font-weight="700" fill="#F8FAFC">Repository layout</text>
  <text x="52" y="100" font-family="system-ui,sans-serif" font-size="14" fill="#94A3B8">Verified top-level product directories</text>

  <g font-family="ui-monospace,monospace" font-size="14" fill="#CBD5E1">
    <text x="80" y="160" fill="#F8FAFC" font-weight="700">AgentDoctor/</text>
    <text x="100" y="192">+- src/</text>
    <text x="120" y="220" fill="#94A3B8">|  +- cli/                 # scan, fix, verify, brain-mcp</text>
    <text x="120" y="248" fill="#94A3B8">|  +- core/</text>
    <text x="140" y="276" fill="#7C3AED">|  |  +- understanding/   # Project Brain + discovery</text>
    <text x="140" y="304" fill="#94A3B8">|  |  +- fix/ rules/ scanner/ verify/</text>
    <text x="120" y="332" fill="#06B6D4">|  +- mcp/brain/           # STDIO MCP bridge</text>
    <text x="120" y="360" fill="#94A3B8">|  +- agents/ detectors/ reporters/</text>
    <text x="120" y="388" fill="#94A3B8">|  +- utils/</text>
    <text x="100" y="420">+- tests/                   # unit + understanding + mcp</text>
    <text x="100" y="448">+- fixtures/                # scan + understanding fixtures</text>
    <text x="100" y="476">+- validation/              # project-brain + mcp-agent</text>
    <text x="100" y="504">+- docs/                    # product + MCP docs</text>
    <text x="100" y="532">+- examples/mcp/            # Cursor / Claude / Codex configs</text>
    <text x="100" y="560">+- action.yml               # GitHub Action (Safety CI)</text>
  </g>

  <text x="80" y="620" font-family="system-ui,sans-serif" font-size="12" fill="#64748B">Local-only (not product source): .agentdoctor/  .cursor/</text>
</svg>
