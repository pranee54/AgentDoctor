<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AgentDoctor - Evidence-backed Project Brain for AI Coding Agents</title>
  <desc id="desc">Flow from Repository through Project Understanding, Project Brain, and MCP to AI coding agents</desc>
  <rect width="1280" height="720" fill="#07111F"/>
  <rect x="48" y="48" width="1184" height="624" rx="16" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="48" y="48" width="1184" height="4" fill="#7C3AED"/>

  <text x="80" y="120" font-family="system-ui,sans-serif" font-size="42" font-weight="700" fill="#F8FAFC">AgentDoctor</text>
  <text x="80" y="168" font-family="system-ui,sans-serif" font-size="22" fill="#94A3B8">Evidence-backed Project Brain for AI Coding Agents</text>
  <text x="80" y="208" font-family="ui-monospace,monospace" font-size="14" fill="#7C3AED">v1.1.0 - local - deterministic - STDIO MCP</text>

  <g font-family="system-ui,sans-serif" font-size="15" font-weight="600">
    <rect x="80" y="280" width="180" height="64" rx="10" fill="#0F1B2D" stroke="#2563EB" stroke-width="1.5"/>
    <text x="170" y="318" text-anchor="middle" fill="#F8FAFC">Repository</text>

    <line x1="260" y1="312" x2="292" y2="312" stroke="#06B6D4" stroke-width="2"/>
    <polygon points="300,312 290,306 290,318" fill="#06B6D4"/>

    <rect x="308" y="280" width="200" height="64" rx="10" fill="#0F1B2D" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="408" y="310" text-anchor="middle" fill="#F8FAFC">Project</text>
    <text x="408" y="330" text-anchor="middle" fill="#94A3B8" font-size="13" font-weight="500">Understanding</text>

    <line x1="508" y1="312" x2="540" y2="312" stroke="#06B6D4" stroke-width="2"/>
    <polygon points="548,312 538,306 538,318" fill="#06B6D4"/>

    <rect x="556" y="280" width="180" height="64" rx="10" fill="#0F1B2D" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="646" y="318" text-anchor="middle" fill="#F8FAFC">Project Brain</text>

    <line x1="736" y1="312" x2="768" y2="312" stroke="#06B6D4" stroke-width="2"/>
    <polygon points="776,312 766,306 766,318" fill="#06B6D4"/>

    <rect x="784" y="280" width="160" height="64" rx="10" fill="#0F1B2D" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="864" y="318" text-anchor="middle" fill="#F8FAFC">MCP Server</text>

    <line x1="944" y1="312" x2="976" y2="312" stroke="#06B6D4" stroke-width="2"/>
    <polygon points="984,312 974,306 974,318" fill="#06B6D4"/>

    <rect x="992" y="280" width="200" height="64" rx="10" fill="#0F1B2D" stroke="#10B981" stroke-width="1.5"/>
    <text x="1092" y="310" text-anchor="middle" fill="#F8FAFC">AI Coding</text>
    <text x="1092" y="330" text-anchor="middle" fill="#94A3B8" font-size="13" font-weight="500">Agents</text>
  </g>

  <g font-family="system-ui,sans-serif" font-size="13">
    <text x="80" y="420" fill="#94A3B8">Agent configuration examples</text>
    <rect x="80" y="440" width="100" height="36" rx="8" fill="#122033" stroke="#334155"/>
    <text x="130" y="463" text-anchor="middle" fill="#F8FAFC">Cursor</text>
    <rect x="196" y="440" width="120" height="36" rx="8" fill="#122033" stroke="#334155"/>
    <text x="256" y="463" text-anchor="middle" fill="#F8FAFC">Claude Code</text>
    <rect x="332" y="440" width="90" height="36" rx="8" fill="#122033" stroke="#334155"/>
    <text x="377" y="463" text-anchor="middle" fill="#F8FAFC">Codex</text>
  </g>

  <g font-family="system-ui,sans-serif" font-size="13">
    <text x="80" y="540" fill="#94A3B8">Also ships Safety V1</text>
    <text x="80" y="568" fill="#CBD5E1">Scan - Fix - Verify - Policy - CI</text>
    <text x="80" y="610" fill="#64748B">Not a chatbot - Not RAG - Not vulnerability scanning as Brain risk</text>
  </g>
